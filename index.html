<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5b3fd6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>SATzap</title>
<style>
:root{--bg:#f4f3fb;--card:#fff;--text:#16132b;--muted:#625f7a;--line:#dcd9ee;--pur:#5b3fd6;--yel:#ffc800;--grn:#12a15f;--red:#d63c3c;--okbg:#dcf5e8;--badbg:#fbe0e0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12101f;--card:#1d1a30;--text:#eeecfb;--muted:#a29fbd;--line:#322e4d;--okbg:#12362a;--badbg:#3d1d1f}}
:root[data-theme="dark"]{--bg:#12101f;--card:#1d1a30;--text:#eeecfb;--muted:#a29fbd;--line:#322e4d;--okbg:#12362a;--badbg:#3d1d1f}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45}
main{max-width:520px;margin:0 auto;padding:16px 16px 40px}
h1{font-size:2.3rem;font-weight:800;line-height:1.05;margin:6px 0 8px;letter-spacing:-1px}h1 b{color:var(--pur)}
h2{font-size:1rem;margin:20px 2px 10px}
.sub{color:var(--muted);margin:0 0 14px}.center{text-align:center}.note{font-size:.78rem;color:var(--muted);margin-top:16px}
button{font:inherit;color:inherit;cursor:pointer;border:0;touch-action:manipulation;min-height:48px}
:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
input{width:100%;font:inherit;font-size:16px;color:inherit;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px;margin:4px 0}
.lab{display:block;font-weight:700;font-size:.9rem;margin:14px 0 6px}
.go{width:100%;background:var(--yel);color:#16132b;font-weight:800;font-size:1.1rem;padding:14px;margin-top:12px;border-radius:20px;box-shadow:0 4px 0 #c99a00}
.go:active{transform:translateY(3px);box-shadow:none}
.go.ghost{background:var(--card);color:var(--text);border:2px solid var(--line);box-shadow:0 3px 0 var(--line)}
.go.sm{width:auto;font-size:.9rem;padding:8px 16px;min-height:40px;margin:0}
.lk{background:none;color:var(--muted);font-weight:600;padding:0 4px}
.av{display:inline-block;border-radius:50%;overflow:hidden;line-height:0;flex:none;box-shadow:0 3px 0 rgba(0,0,0,.12)}.av svg{display:block}
.hero{text-align:center;padding-top:6vh}
.hero .logo{display:inline-block;animation:pulse 2.6s ease-in-out infinite;filter:drop-shadow(0 8px 0 rgba(91,63,214,.25))}
.hero h1{font-size:3.2rem}
.avrow{display:flex;justify-content:center;margin:14px 0}.avrow .av{margin:0 -6px;border:3px solid var(--bg)}
.feat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px;text-align:left}
.feat div{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px}.feat i{font-style:normal;font-size:1.5rem}.feat b{display:block}.feat span{font-size:.78rem;color:var(--muted)}
.sw{display:flex;flex-wrap:wrap;gap:8px}
.c,.a{border:3px solid transparent;min-height:0}.c{width:40px;height:40px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(0,0,0,.1)}.a{border-radius:50%;padding:0;background:none;line-height:0;overflow:hidden;width:54px;height:54px}
.c.sel,.a.sel{border-color:var(--pur);box-shadow:0 0 0 2px var(--yel)}
.ulist{display:flex;flex-direction:column;gap:10px}
.urow{display:flex;align-items:center;gap:12px;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:10px 12px;width:100%;text-align:left;box-shadow:0 3px 0 var(--line)}
.urow b{flex:1}.urow small{color:var(--muted)}.urow.me{border-color:var(--pur)}.urow.sel{border-color:var(--yel)}
.ob{text-align:center;padding-top:8vh}.ob .big{font-size:5rem}.dots{display:flex;justify-content:center;gap:8px;margin:18px 0}.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--pur);width:26px;border-radius:99px}
.head{display:flex;align-items:center;gap:12px;margin-bottom:6px}.head h1{flex:1;font-size:1.4rem;margin:0}
.chip{background:var(--card);border:2px solid var(--line);border-radius:99px;padding:6px 12px;font-weight:700;font-size:.9rem}
.saved{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--pur);color:#fff;border-radius:20px;padding:12px 16px;margin:12px 0;box-shadow:0 4px 0 #3f28a8}.saved span{display:block;font-size:.8rem;opacity:.85}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile,.opt{background:var(--card);border:2px solid var(--line);box-shadow:0 3px 0 var(--line);border-radius:20px}
.tile:active,.opt:active{transform:translateY(3px);box-shadow:none}
.tile{padding:14px 12px;text-align:left}.tile i{font-style:normal;font-size:1.6rem;display:block}.tile strong{display:block;font-size:.95rem}.tile span{font-size:.75rem;color:var(--muted)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}.stat b{display:block;font-size:1.3rem}.stat span{font-size:.72rem;color:var(--muted)}
.bar{height:10px;border-radius:99px;background:var(--line);margin:8px 0 4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--yel);border-radius:99px;transition:width .3s}
.barl{display:flex;justify-content:space-between;font-size:.75rem;color:var(--muted);margin-bottom:12px}.top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:.9rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px}.crow{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.tag{background:var(--pur);color:#fff;font-size:.72rem;font-weight:700;padding:2px 10px;border-radius:99px}
.bm{background:none;font-size:.85rem;font-weight:600;color:var(--muted);padding:0 6px}.bm.on{color:var(--pur)}
.q{font-size:1.15rem;font-weight:600;white-space:pre-wrap;overflow-wrap:anywhere}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:12px 14px;margin-bottom:10px;font-size:1.05rem}
.opt i{flex:none;width:28px;height:28px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-style:normal;font-weight:800;font-size:.85rem}
.opt.ok{background:var(--okbg);border-color:var(--grn);box-shadow:0 3px 0 var(--grn)}.opt.bad{background:var(--badbg);border-color:var(--red);box-shadow:0 3px 0 var(--red)}.opt.dim{opacity:.55}
.fb{border-radius:16px;padding:12px 14px;margin:4px 0}.fb.ok{background:var(--okbg)}.fb.bad{background:var(--badbg)}.fb small{display:block;margin-top:6px;color:var(--muted)}
.bigs{font-size:3.4rem;font-weight:800;line-height:1;margin:10px 0}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs button{flex:1;background:none;font-size:.75rem;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:0}.tabs button i{font-style:normal;font-size:1.4rem}.tabs button.on{color:var(--pur)}
.goal{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:12px 14px;margin:10px 0}.gt{display:flex;justify-content:space-between}.gt span{color:var(--muted);font-size:.85rem}.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}.bd{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 2px;text-align:center;font-size:.65rem}.bd i{font-style:normal;font-size:1.6rem;display:block}.bd.off{opacity:.35;filter:grayscale(1)}
.crown{background:linear-gradient(135deg,#ffd75e,#ff9f1c);color:#3a2600;border-radius:20px;padding:14px;text-align:center;margin-bottom:12px;font-weight:700}
@keyframes pulse{50%{transform:scale(1.08)}}@media (prefers-reduced-motion:reduce){.hero .logo{animation:none}}
</style>
</head>
